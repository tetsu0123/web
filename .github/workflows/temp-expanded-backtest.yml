name: Temporary self-improvement event panel

on:
  push:
    branches:
      - backtest-self-improve-20260904
    paths:
      - "tmp_backtest/**"
      - ".github/workflows/temp-expanded-backtest.yml"

permissions:
  contents: read

jobs:
  build-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=1.26" "yfinance>=0.2.65" requests lxml html5lib beautifulsoup4

      - name: Build broad event panel
        run: |
          sed -i 's/len(temp) > 50/len(temp) > 5/' tmp_backtest/expanded_backtest.py
          python tmp_backtest/build_event_panel.py

      - name: Upload event panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-event-panel
          path: tmp_backtest/event_output/
          if-no-files-found: warn
          retention-days: 1

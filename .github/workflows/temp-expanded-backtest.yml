name: Temporary expanded stock backtest

on:
  push:
    branches:
      - backtest-expanded-20260903
    paths:
      - "tmp_backtest/**"
      - ".github/workflows/temp-expanded-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=1.26" "yfinance>=0.2.65" requests lxml html5lib beautifulsoup4

      - name: Run expanded backtest
        run: |
          sed -i 's/len(temp) > 50/len(temp) > 5/' tmp_backtest/expanded_backtest.py
          python tmp_backtest/expanded_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-backtest-results
          path: tmp_backtest/output/
          if-no-files-found: warn
          retention-days: 1
